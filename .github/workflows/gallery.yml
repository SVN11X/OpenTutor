name: gallery
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Take screenshots of every screen
        run: python scripts/gallery.py --out build/gallery
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: build/gallery/
